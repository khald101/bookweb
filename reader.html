<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قارئ الكتب الذكي | المكتبة الرقمية</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PDF.js -->
  <script src="assets/js/pdf.min.js"></script>

  <style>
    body {
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .reader-navbar {
      height: 56px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 50;
      flex-shrink: 0;
    }

    .reader-workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 56px);
      overflow: hidden;
      position: relative;
    }

    .reader-sidebar {
      width: 320px;
      background: var(--sidebar-bg);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
      flex-shrink: 0;
      transition: width var(--transition-normal);
      z-index: 40;
    }

    .reader-sidebar.collapsed {
      width: 0;
      display: none;
    }

    .sidebar-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.15);
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
    }

    .sidebar-tab-btn {
      flex: 1;
      padding: 10px 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      transition: all var(--transition-fast);
    }

    .sidebar-tab-btn.active {
      color: var(--accent-primary);
      border-bottom-color: var(--accent-primary);
      background: rgba(99, 102, 241, 0.08);
    }

    .sidebar-tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: none;
    }

    .sidebar-tab-content.active {
      display: block;
    }

    .reader-viewport {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 80px 16px;
      background: var(--reader-bg);
      position: relative;
    }

    .reader-sheet {
      width: 100%;
      max-width: 820px;
      min-height: calc(100vh - 160px);
      background: var(--reader-paper);
      color: var(--reader-text);
      padding: 40px 48px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      line-height: 2.1;
      font-size: 19px;
      font-family: var(--font-amiri);
      position: relative;
      user-select: text;
    }

    /* Floating Selection Toolbar */
    .floating-toolbar {
      position: absolute;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-glow);
      padding: 6px 10px;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 100;
      transform: translate(-50%, -100%);
      margin-top: -12px;
      backdrop-filter: blur(12px);
    }

    .floating-toolbar.active {
      display: flex;
    }

    .category-dot-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .category-dot-btn:hover {
      transform: scale(1.2);
    }

    /* Reader Bottom Control Bar */
    .reader-bottom-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(12px);
      z-index: 45;
    }

    .highlight-mark {
      padding: 1px 4px;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .highlight-mark:hover {
      opacity: 0.85;
    }

    /* Search match mark */
    .search-match-text {
      background: rgba(245, 158, 11, 0.4);
      color: #fff;
      padding: 1px 3px;
      border-radius: 3px;
      font-weight: 700;
    }

    @media (max-width: 768px) {
      .reader-sheet {
        padding: 24px 18px;
        font-size: 17px;
      }
      .reader-sidebar {
        position: absolute;
        right: 0;
        top: 0;
        width: 100%;
        max-width: 300px;
        box-shadow: var(--shadow-lg);
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="reader-navbar">
    <div style="display: flex; align-items: center; gap: 12px; min-width: 0;">
      <a href="index.html" class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.82rem; gap: 6px;">
        <i data-lucide="arrow-right" style="width: 14px; height: 14px;"></i>
        <span>المكتبة</span>
      </a>

      <div style="min-width: 0;">
        <div id="readerBookTitle" style="font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px;">جاري تحميل الكتاب...</div>
        <div id="readerBookAuthor" style="font-size: 0.75rem; color: var(--text-muted);">المؤلف: غير محدد</div>
      </div>
    </div>

    <!-- Center Page Control -->
    <div style="display: flex; align-items: center; gap: 8px;">
      <button class="btn-icon" style="width: 32px; height: 32px;" onclick="goToPage(currentPage - 1)" title="الصفحة السابقة (سهم يسار)">
        <i data-lucide="chevron-right"></i>
      </button>

      <div style="display: flex; align-items: center; gap: 6px; font-size: 0.85rem;">
        <span>صفحة</span>
        <input type="number" id="jumpPageInput" min="1" value="1" style="width: 54px; text-align: center; padding: 4px; border-radius: var(--radius-sm); background: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--text-primary); font-family: inherit;" onchange="goToPage(parseInt(this.value))">
        <span>من <span id="readerTotalPages">1</span></span>
      </div>

      <button class="btn-icon" style="width: 32px; height: 32px;" onclick="goToPage(currentPage + 1)" title="الصفحة التالية (سهم يمين)">
        <i data-lucide="chevron-left"></i>
      </button>
    </div>

    <!-- Right Controls: Font, Themes, Sidebar -->
    <div style="display: flex; align-items: center; gap: 6px;">
      <!-- Font Size -->
      <button class="btn-icon" style="width: 32px; height: 32px;" onclick="changeFontSize(-1)" title="تصغير الخط">
        <i data-lucide="zoom-out" style="width: 14px; height: 14px;"></i>
      </button>
      <button class="btn-icon" style="width: 32px; height: 32px;" onclick="changeFontSize(1)" title="تكبير الخط">
        <i data-lucide="zoom-in" style="width: 14px; height: 14px;"></i>
      </button>

      <!-- Font Family -->
      <select id="fontFamilySelect" onchange="changeFontFamily(this.value)" style="padding: 4px 8px; border-radius: var(--radius-sm); background: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--text-primary); font-size: 0.8rem; font-family: inherit;">
        <option value="Amiri">خط أميري</option>
        <option value="Cairo">خط القاهرة</option>
        <option value="Tajawal">خط تجوال</option>
      </select>

      <!-- Themes -->
      <button class="btn-icon" style="width: 32px; height: 32px;" onclick="switchTheme('dark')" title="داكن"><i data-lucide="moon" style="width: 14px; height: 14px;"></i></button>
      <button class="btn-icon" style="width: 32px; height: 32px;" onclick="switchTheme('sepia')" title="سيبيا"><i data-lucide="coffee" style="width: 14px; height: 14px;"></i></button>
      <button class="btn-icon" style="width: 32px; height: 32px;" onclick="switchTheme('light')" title="فاتح"><i data-lucide="sun" style="width: 14px; height: 14px;"></i></button>

      <!-- Sidebar Toggle -->
      <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.82rem; gap: 6px;" onclick="toggleSidebar()">
        <i data-lucide="list" style="width: 14px; height: 14px;"></i>
        <span>القائمة والبحث</span>
      </button>
    </div>
  </header>

  <!-- Workspace -->
  <div class="reader-workspace">
    <!-- Reader Main Viewport -->
    <main class="reader-viewport" id="readerViewport" onclick="handleDocumentClick(event)">
      <!-- Book Page Sheet -->
      <article class="reader-sheet" id="readerSheet">
        <div id="pageTextContent">
          <!-- Text rendered here -->
        </div>
      </article>

      <!-- Floating Highlight Toolbar -->
      <div id="floatingToolbar" class="floating-toolbar">
        <span style="font-size: 0.75rem; color: var(--text-muted); margin-left: 4px;">تظليل:</span>
        <div id="floatingCategoriesDots" style="display: flex; gap: 5px;"></div>
        <div style="width: 1px; height: 20px; background: var(--border-color); margin: 0 4px;"></div>
        <button class="btn-icon" style="width: 26px; height: 26px;" onclick="addNoteFromSelection()" title="إضافة ملاحظة على النص"><i data-lucide="file-text" style="width: 14px; height: 14px;"></i></button>
        <button class="btn-icon" style="width: 26px; height: 26px;" onclick="copySelectionText()" title="نسخ"><i data-lucide="copy" style="width: 14px; height: 14px;"></i></button>
      </div>

      <!-- Bottom Navigation Controller -->
      <div class="reader-bottom-bar">
        <button class="btn-icon" style="width: 30px; height: 30px;" onclick="goToPage(currentPage - 1)"><i data-lucide="chevron-right"></i></button>
        <div style="font-size: 0.82rem; font-weight: 600;">
          <span id="bottomProgressPct">0%</span> مكتمل
        </div>
        <button class="btn-icon" style="width: 30px; height: 30px;" onclick="toggleBookmarkCurrentPage()" id="btnPageBookmark" title="حفظ علامة مرجعية"><i data-lucide="bookmark" style="width: 16px; height: 16px;"></i></button>
        <button class="btn-icon" style="width: 30px; height: 30px;" onclick="goToPage(currentPage + 1)"><i data-lucide="chevron-left"></i></button>
      </div>
    </main>

    <!-- Sidebar Tools -->
    <aside class="reader-sidebar" id="readerSidebar">
      <!-- Tabs Header -->
      <div class="sidebar-tabs">
        <button class="sidebar-tab-btn active" onclick="switchSidebarTab('search')">
          <i data-lucide="search" style="width: 14px; height: 14px;"></i>
          <span>البحث</span>
        </button>
        <button class="sidebar-tab-btn" onclick="switchSidebarTab('toc')">
          <i data-lucide="list" style="width: 14px; height: 14px;"></i>
          <span>الصفحات</span>
        </button>
        <button class="sidebar-tab-btn" onclick="switchSidebarTab('highlights')">
          <i data-lucide="highlighter" style="width: 14px; height: 14px;"></i>
          <span>التظليلات</span>
        </button>
        <button class="sidebar-tab-btn" onclick="switchSidebarTab('notes')">
          <i data-lucide="file-text" style="width: 14px; height: 14px;"></i>
          <span>الملاحظات</span>
        </button>
      </div>

      <!-- Search Tab -->
      <div id="tabSearch" class="sidebar-tab-content active">
        <div style="position: relative; margin-bottom: 12px;">
          <i data-lucide="search" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-muted);"></i>
          <input type="text" id="inBookSearchInput" class="form-input" style="padding-right: 32px; font-size: 0.85rem;" placeholder="ابحث داخل صفحات هذا الكتاب..." oninput="handleInBookSearch(this.value)">
        </div>
        <div id="searchMatchesCount" style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 10px;"></div>
        <div id="searchResultsList" style="display: flex; flex-direction: column; gap: 8px;"></div>
      </div>

      <!-- TOC / Pages Tab -->
      <div id="tabToc" class="sidebar-tab-content">
        <div style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 8px;">انتقال سريع للصفحات:</div>
        <div id="pagesGridTOC" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;"></div>
      </div>

      <!-- Highlights Tab -->
      <div id="tabHighlights" class="sidebar-tab-content">
        <div id="bookHighlightsList" style="display: flex; flex-direction: column; gap: 10px;"></div>
      </div>

      <!-- Notes Tab -->
      <div id="tabNotes" class="sidebar-tab-content">
        <div style="margin-bottom: 14px;">
          <textarea id="newNoteInput" class="form-textarea" rows="2" style="font-size: 0.85rem;" placeholder="اكتب ملاحظة أو فائدة للصفحة الحالية..."></textarea>
          <button class="btn btn-primary" style="width: 100%; margin-top: 6px; padding: 6px; font-size: 0.8rem; justify-content: center;" onclick="saveCurrentPageNote()">
            <span>إضافة الملاحظة</span>
          </button>
        </div>
        <div id="bookNotesList" style="display: flex; flex-direction: column; gap: 8px;"></div>
      </div>
    </aside>
  </div>

  <!-- Note Dialog Modal -->
  <div id="noteModal" class="modal-overlay" style="display: none;">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 class="modal-title">إضافة ملاحظة على النص المظلل</h3>
        <button class="btn-icon" onclick="closeNoteModal()"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body">
        <div style="padding: 10px; background: rgba(255,255,255,0.05); border-radius: var(--radius-md); font-family: var(--font-amiri); font-size: 0.95rem; margin-bottom: 12px;" id="noteSelectedTextPreview"></div>
        <textarea id="noteInputText" class="form-textarea" rows="3" placeholder="سجل تعليقك أو فائدتك على هذا النص..."></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeNoteModal()">إلغاء</button>
        <button class="btn btn-primary" onclick="confirmSaveNoteFromSelection()">حفظ الملاحظة</button>
      </div>
    </div>
  </div>

  <!-- Toast Message -->
  <div id="readerToast" class="toast-msg">
    <i data-lucide="check-circle" style="color: var(--success); width: 18px; height: 18px;"></i>
    <span id="readerToastText">تم بنجاح</span>
  </div>

  <!-- Scripts -->
  <script src="assets/js/db.js"></script>
  <script src="assets/js/reader.js"></script>
</body>
</html>
